<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized production request path</title>
  <desc id="desc">Clients send requests through AWS API Gateway into an AKS cluster running Traefik ingress and .NET application pods. The application uses Redis and Elasticsearch and sends telemetry to logs and Application Insights.</desc>
  <defs>
    <style>
      .bg{fill:#f7fafc}.box{fill:#fff;stroke:#2365aa;stroke-width:2}.store{fill:#eef5fb;stroke:#2365aa;stroke-width:2}.telemetry{fill:#fff7ed;stroke:#c76b16;stroke-width:2}.title{font:700 22px system-ui,sans-serif;fill:#15263b}.label{font:600 18px system-ui,sans-serif;fill:#15263b}.small{font:15px system-ui,sans-serif;fill:#526577}.arrow{stroke:#2365aa;stroke-width:3;fill:none;marker-end:url(#arrow)}.dashed{stroke:#c76b16;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#orangeArrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2365aa"/></marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c76b16"/></marker>
  </defs>
  <rect class="bg" width="1200" height="620" rx="18"/>
  <text class="title" x="50" y="55">Sanitized production request path</text>
  <text class="small" x="50" y="84">The capacity test followed the request path and its dependencies.</text>

  <rect class="box" x="55" y="220" width="170" height="90" rx="10"/><text class="label" x="140" y="258" text-anchor="middle">Clients</text><text class="small" x="140" y="284" text-anchor="middle">Batch requests</text>
  <rect class="box" x="285" y="220" width="190" height="90" rx="10"/><text class="label" x="380" y="258" text-anchor="middle">AWS API Gateway</text><text class="small" x="380" y="284" text-anchor="middle">Access logs</text>
  <rect class="box" x="535" y="145" width="305" height="240" rx="14"/><text class="label" x="687" y="180" text-anchor="middle">AKS cluster</text><text class="small" x="687" y="205" text-anchor="middle">Traefik ingress · cert-manager</text>
  <rect class="box" x="590" y="235" width="195" height="86" rx="10"/><text class="label" x="687" y="271" text-anchor="middle">.NET application pods</text><text class="small" x="687" y="296" text-anchor="middle">Kubernetes requests/limits</text>
  <rect class="store" x="900" y="125" width="220" height="82" rx="10"/><text class="label" x="1010" y="160" text-anchor="middle">Redis</text><text class="small" x="1010" y="185" text-anchor="middle">Cache / connections</text>
  <rect class="store" x="900" y="245" width="220" height="82" rx="10"/><text class="label" x="1010" y="280" text-anchor="middle">Elasticsearch</text><text class="small" x="1010" y="305" text-anchor="middle">Search / enrichment</text>
  <rect class="telemetry" x="900" y="400" width="220" height="82" rx="10"/><text class="label" x="1010" y="435" text-anchor="middle">Telemetry</text><text class="small" x="1010" y="460" text-anchor="middle">ELK · Application Insights</text>

  <path class="arrow" d="M225 265 H285"/><path class="arrow" d="M475 265 H535"/><path class="arrow" d="M840 220 C865 190 875 175 900 165"/><path class="arrow" d="M840 285 H900"/><path class="dashed" d="M687 385 V440 H900"/>
  <text class="small" x="70" y="555">Load testing varied request rate and batch size, then observed latency, CPU, dependency wait time, and pod health.</text>
</svg>
